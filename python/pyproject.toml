[tool.poetry]
name = "wdl-model"
version = "0.0.1b0"
description = "TODO"
license = "MIT"
authors = ["Art Gramlich <art.gramlich@myriad.com>"]
maintainers = ["Art Gramlich <art.gramlich@myriad.com>"]
readme = "README.md"
packages = [{ include = "wdl_model", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10"
antlr4-python3-runtime = "4.13.2"
httpx = "^0.27.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
ruff = "^0.5.0"
antlr4-tools = "^0.2.2"

[tool.ruff]
extend-exclude = [
	"src/wdl_model/grammar/**",
	"src/**/generated/**",
]

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
