[package]
name = "wdl-model"
version = "0.0.1"
edition = "2021"
description = "WDL object model with optional validation layers"
license = "MIT"

[dependencies]
antlr4rust = "0.5.2"
thiserror = "2"
indexmap = "2"
log = "0.4"
url = "2"

[dependencies.reqwest]
version = "0.12"
features = ["blocking"]
optional = true

[features]
default = []
http-resolver = ["dep:reqwest"]

[dev-dependencies]
rstest = "0.23"

[build-dependencies]
# build.rs invokes antlr4-rust-tool.jar via std::process::Command (requires Java)

[toolchain]
channel = "1.95.0"
components = ["rust-src"]
